name: Bug 反馈 / Bug Report
description: 任务执行异常、识别错误、界面报错等问题 / Task failures, recognition errors and other issues
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: |
        发生了什么，怎么复现
        What happened and how can we reproduce it?
      placeholder: |
        现象、复现步骤……
        What you saw, steps to reproduce...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 应用版本 / App version
      placeholder: 例如 v1.2.3 / e.g. v1.2.3
    validations:
      required: true

  - type: upload
    id: attachments
    attributes:
      label: 截图与日志 / Screenshots & Logs
      description: |
        截图、录屏，或应用目录 logs/ 下的日志文件
        Screenshots, recordings, or log files from the app's logs/ folder
    validations:
      required: false
