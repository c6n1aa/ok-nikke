name: 功能建议 / Feature Request
description: 新任务、新功能或体验改进建议 / Suggest a new task, feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: 需求描述 / Description
      description: |
        想要什么功能，解决什么问题
        What feature do you want, and what problem does it solve?
      placeholder: |
        希望增加/改进……
        I'd like to see...
    validations:
      required: true
