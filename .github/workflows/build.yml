name: Build

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:

    runs-on: windows-latest

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "c6n1aa@users.noreply.github.com"
          git config --global user.name "c6n1aa"
          echo "action_state=yellow" >> $env:GITHUB_ENV
          echo "${{ env.action_state }}"

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --no-deps -r requirements.txt

      - name: inline_ok_requirements #把ok-script加入源码, 从requirements.txt中删除以提高升级更新速度
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ github.ref_name }}

      - name: Run tests
        run: |
          Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
              Write-Host "Running tests in $($_.FullName)"
              python -m unittest $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Tests failed in $($_.FullName)" }
          }

      - name: Build launcher with PyAppify Action
        id: build-app
        uses: ok-oldking/pyappify-action@master #只编译启动器exe, 不再走NSIS安装器
        with:
          build_exe_only: true

      - name: Package portable zip
        shell: pwsh
        run: |
          # 运行启动器 setup 命令, 在 exe 同目录生成 data(内嵌Python/venv/按tag克隆的代码); -p 需与 pyappify.yml 的 profile 名一致
          $appDir = Join-Path "pyappify_dist" "ok-nikke"
          New-Item -ItemType Directory -Path $appDir -Force | Out-Null
          $exe = Join-Path $appDir "ok-nikke.exe"
          Copy-Item "${{ steps.build-app.outputs.exe-path }}" $exe
          # launcher 是 windows_subsystem="windows" 的 GUI 程序, `&` 不会等待也拿不到退出码;
          # 必须用 Start-Process -Wait -PassThru 阻塞到 setup 完成并读取 ExitCode
          $setupOut = Join-Path "pyappify_dist" "setup.stdout.log"
          $setupErr = Join-Path "pyappify_dist" "setup.stderr.log"
          $setup = Start-Process -FilePath $exe -ArgumentList "-c","setup","-p","Release" -Wait -PassThru -RedirectStandardOutput $setupOut -RedirectStandardError $setupErr
          Get-Content $setupOut -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          Get-Content $setupErr -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          if ($setup.ExitCode -ne 0) { throw "pyappify setup failed with exit code $($setup.ExitCode)" }
          if (-not (Test-Path (Join-Path $appDir "data"))) { throw "pyappify setup did not generate the data folder" }
          # 放更新源配置文件到包根目录, 供用户首次运行前按环境重命名为 pyappify.yml 选择更新源
          Copy-Item "pyappify-cn.yml" (Join-Path $appDir "pyappify-cn.yml")
          Copy-Item "pyappify-global.yml" (Join-Path $appDir "pyappify-global.yml")
          # 清掉打包过程中产生的缓存/日志, 不进便携包
          Remove-Item (Join-Path $appDir "cache") -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $appDir "logs") -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $appDir "EBWebView") -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $appDir -DestinationPath "pyappify_dist\ok-nikke-win32-portable.zip" -Force

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ###  更新日志
              请查看提交记录。
            ### 下载说明
              * [ok-nikke-win32-portable.zip](https://github.com/c6n1aa/ok-nikke/releases/download/${{ github.ref_name }}/ok-nikke-win32-portable.zip) 完整便携包: 解压到任意目录, 运行其中的 ok-nikke.exe (需管理员权限), 应用内可自动更新。
              * Full portable package: extract anywhere, run ok-nikke.exe as administrator. In-app auto-update supported.
              * 无需下载 Source code, 仅供存档用。
          files: pyappify_dist/ok-nikke-win32-portable.zip
