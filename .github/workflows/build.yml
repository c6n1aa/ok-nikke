name: Build

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PYTHONIOENCODING: 'UTF-8'
  # 便携包内独立解释器的版本线（与 pyproject.toml 的 requires-python 对齐）
  STANDALONE_PYTHON: '3.12'

jobs:
  build:

    runs-on: windows-latest

    # 不指定 shell：托管 Windows runner 上 run 步骤默认就是 pwsh（PowerShell Core）。
    # 步骤里只用 5.1/7 行为一致的写法（[System.IO.File]::WriteAllText / ConvertTo-Json /
    # Invoke-RestMethod / Expand-Archive / 外部 tar），不依赖两版的输出编码差异。
    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "c6n1aa@users.noreply.github.com"
          git config --global user.name "c6n1aa"

      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.STANDALONE_PYTHON }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.STANDALONE_PYTHON }}

      - name: Install dependencies (runner, for tests)
        run: pip install --no-deps -r requirements.txt

      - name: Run tests
        run: |
          Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
              Write-Host "Running tests in $($_.FullName)"
              python -m unittest $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Tests failed in $($_.FullName)" }
          }

      - name: Download standalone Python -> python/
        run: |
          # 官方 python-build-standalone 的 install_only 归档：顶层就是 python/，可重定位、自带 pip
          $headers = @{ 'User-Agent' = 'ok-nikke-build' }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest' -Headers $headers
          $pattern = "^cpython-$($env:STANDALONE_PYTHON)\.\d+\+.*-x86_64-pc-windows-msvc-install_only\.tar\.gz$"
          $asset = $release.assets | Where-Object { $_.name -match $pattern } | Select-Object -First 1
          if (-not $asset) { throw "python-build-standalone $($release.tag_name) 里没有匹配 $pattern 的资产" }
          Write-Host "standalone python: $($asset.name) ($([math]::Round($asset.size / 1MB, 1)) MB)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile python.tar.gz
          tar -xzf python.tar.gz
          Remove-Item python.tar.gz
          if (-not (Test-Path 'python/python.exe')) { throw '解压后未找到 python/python.exe' }
          .\python\python.exe -V
          .\python\python.exe -m pip --version

      - name: Download MinGit -> git/
        run: |
          # 只需 cmd/git.exe：更新流程用 git fetch/checkout，不用 git-lfs、不用 bash，故 MinGit 足够
          $headers = @{ 'User-Agent' = 'ok-nikke-build' }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/git-for-windows/git/releases/latest' -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -match '^MinGit-\d+(\.\d+)+-64-bit\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "git-for-windows $($release.tag_name) 里没有 MinGit 64-bit zip 资产" }
          Write-Host "mingit: $($asset.name) ($([math]::Round($asset.size / 1MB, 1)) MB)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mingit.zip
          Expand-Archive -Path mingit.zip -DestinationPath git -Force
          Remove-Item mingit.zip
          if (-not (Test-Path 'git/cmd/git.exe')) { throw '解压后未找到 git/cmd/git.exe' }
          .\git\cmd\git.exe --version

      - name: Install deps into package interpreter
        run: |
          # 方案 C：不内联 ok-script，依赖（含 ok-script/pyappify）全部装进包内解释器
          # --no-deps 必须：PySide6-Fluent-Widgets 依赖 PySide6 元包，不加会拉 addons 几百 MB
          .\python\python.exe -m pip install --no-deps --no-cache-dir --disable-pip-version-check -r requirements.txt
          # 断言 ok/pyappify 来自包内 site-packages（仓库根没有内联目录，防止日后被重新内联而静默遮蔽）
          .\python\python.exe -c "import ok, pyappify, sys; print('ok      ', ok.__file__); print('pyappify', pyappify.__file__); assert 'site-packages' in ok.__file__, 'ok 不是来自 site-packages'; assert 'site-packages' in pyappify.__file__, 'pyappify 不是来自 site-packages'"

      - name: Write version.txt and default update config
        run: |
          $tag = "${{ github.ref_name }}"
          # 显式写成无 BOM UTF-8：version.txt 会被 src/config.py 与 update.py 解析
          $noBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $PWD 'version.txt'), "$tag`n", $noBom)
          New-Item -ItemType Directory -Path configs -Force | Out-Null
          $updateJson = @{ channel = 'auto'; custom_git_url = ''; pip_index = ''; update_method = 'manual' } | ConvertTo-Json
          [System.IO.File]::WriteAllText((Join-Path $PWD 'configs/update.json'), $updateJson, $noBom)
          # 冒烟：包内解释器 + 包根为 cwd 时，配置与版本号都要正确
          .\python\python.exe -c "import sys; sys.argv=['main.py']; from src.config import config; print('version =', config['version']); assert config['version'] == '$tag', config['version']"

      - name: Build entry shim (MSVC)
        run: |
          # 入口 exe 自身提权（manifest）并拉起 python\pythonw.exe main.py，链接后 launcher/build.py 会校验 manifest
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "找不到 vswhere.exe" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "找不到带 C++ 工具的 Visual Studio 安装" }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64' | Out-Null
          python launcher\build.py --out ok-nikke.exe

      - name: Sync to CNB mirror
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CNB_DEPLOY_TOKEN: ${{ secrets.CNB_DEPLOY_TOKEN }}
        run: |
          # 把 deploy.txt 里列出的文件 + 同名 tag 推送到国内镜像仓库，供 CN 用户应用内更新
          $tag = "${{ github.ref_name }}"
          $mirrorUrl = "https://cnb:$env:CNB_DEPLOY_TOKEN@cnb.cool/c6n1aa/ok-nikke"
          $work = Join-Path $env:RUNNER_TEMP "cnb-mirror"
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          git clone "$mirrorUrl" $work
          Set-Location $work

          # 空仓库兜底: 无 HEAD 时先建 main 分支
          if (-not (git rev-parse --verify HEAD 2>$null)) {
            git checkout --orphan main
          }

          # 按 deploy.txt 清单把文件从源码工作树拷进镜像
          $srcRoot = $env:GITHUB_WORKSPACE
          Get-Content (Join-Path $srcRoot "deploy.txt") |
            Where-Object { $_.Trim() -and -not $_.Trim().StartsWith('#') } |
            ForEach-Object {
              $entry = $_.Trim().Trim('/')
              $src = Join-Path $srcRoot $entry
              if (Test-Path $src) {
                Copy-Item $src $work -Recurse -Force
              }
            }

          Get-ChildItem $work -Recurse -Directory -Filter "__pycache__" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          # launcher/build-stamp 是入口 exe 的中间产物（已 gitignore），不要同步进镜像
          Remove-Item (Join-Path $work 'launcher/build-stamp') -Recurse -Force -ErrorAction SilentlyContinue

          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to sync to CNB mirror."
          } else {
            git commit -m "release $tag"
          }
          git tag -f "$tag"
          git push origin HEAD
          git push origin "$tag" -f

          # 断言镜像上目标 tag 确实存在：CNB 无 tag 时，CN 用户的应用内更新会静默失败
          $remoteTag = git ls-remote --tags "https://cnb.cool/c6n1aa/ok-nikke" "refs/tags/$tag"
          if (-not $remoteTag) { throw "CNB 镜像上不存在 tag $tag，应用内更新会失败" }
          Write-Host "CNB mirror has tag $tag"

      - name: Package portable zip
        run: |
          # 单包：仓库 tag 内容 + python/ + git/ + 入口 exe + version.txt + 默认 update.json
          $tag = "${{ github.ref_name }}"
          $stage = Join-Path $PWD 'dist/ok-nikke'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          git archive --format=tar $tag -o src.tar
          tar -xf src.tar -C $stage
          Remove-Item src.tar
          Move-Item python, git, ok-nikke.exe, version.txt $stage
          New-Item -ItemType Directory -Path (Join-Path $stage 'configs') -Force | Out-Null
          Copy-Item configs/update.json (Join-Path $stage 'configs/update.json')
          # .gitignore 必须留在包里：update.py 首次更新会在包根 git init + seed commit，
          # 靠它（与 .git/info/exclude）保证 configs/logs/screenshots/python/git 不被提交
          Get-ChildItem $stage -Recurse -Directory -Filter "__pycache__" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          # bsdtar 按扩展名推断 zip（Compress-Archive 对 ~1GB 树很慢）
          tar -C (Join-Path $PWD 'dist') -a -c -f (Join-Path $PWD 'dist/ok-nikke-win32-portable.zip') ok-nikke
          Get-Item dist/ok-nikke-win32-portable.zip | Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length / 1MB, 1)}}

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ###  更新日志
              请查看提交记录。
            ### 下载说明
              * [ok-nikke-win32-portable.zip](https://github.com/c6n1aa/ok-nikke/releases/download/${{ github.ref_name }}/ok-nikke-win32-portable.zip) 完整便携包: 解压到任意目录运行 ok-nikke.exe (需管理员权限)。
                更新源出厂为「自动」(按系统语言选 GitHub / CNB 镜像)，可在「关于 → 应用更新」中随时切换或填自定义 URL。
              * 从 v0.1.x 的老便携包升级请在应用内更新，或直接解压新包覆盖；新包不再需要 pyappify 启动器的 setup 步骤。
              * 无需下载 Source code, 仅供存档用。
          files: |
            dist/ok-nikke-win32-portable.zip
