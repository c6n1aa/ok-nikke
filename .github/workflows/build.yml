name: Build

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:

    runs-on: windows-latest

    env:
      PYTHONIOENCODING: 'UTF-8'
      # 复用指定 Release 中的 ok-nikke-win32.zip 启动器, 跳过约 12 分钟的 Tauri 编译;
      # 取值形如 https://api.github.com/repos/c6n1aa/ok-nikke/releases/tags/v0.1.1
      # 仅当 icons/ 与 pyappify.yml 自该版本起都未变化时可用(两者均内嵌在 exe 中), 平时留空
      USE_RELEASE: ''

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "c6n1aa@users.noreply.github.com"
          git config --global user.name "c6n1aa"
          echo "action_state=yellow" >> $env:GITHUB_ENV
          echo "${{ env.action_state }}"

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --no-deps -r requirements.txt

      - name: inline_ok_requirements #把ok-script加入源码, 从requirements.txt中删除以提高升级更新速度
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ github.ref_name }}

      - name: Run tests
        run: |
          Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
              Write-Host "Running tests in $($_.FullName)"
              python -m unittest $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Tests failed in $($_.FullName)" }
          }

      - name: Sync to CNB mirror
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          CNB_DEPLOY_TOKEN: ${{ secrets.CNB_DEPLOY_TOKEN }}
        run: |
          # 把 deploy.txt 里列出的文件 + 同名 tag 推送到国内镜像仓库, 供 CN 用户应用内更新
          $tag = "${{ github.ref_name }}"
          $mirrorUrl = "https://cnb:$env:CNB_DEPLOY_TOKEN@cnb.cool/c6n1aa/ok-nikke"
          $work = Join-Path $env:RUNNER_TEMP "cnb-mirror"
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          git clone "$mirrorUrl" $work
          Set-Location $work

          # 空仓库兜底: 无 HEAD 时先建 main 分支
          if (-not (git rev-parse --verify HEAD 2>$null)) {
            git checkout --orphan main
          }

          # 按 deploy.txt 清单把文件从源码工作树拷进镜像(此时已内联 ok/pyappify);
          # pyappify.yml 原样同步: 其 Release-CN profile 的 git_url 已指向 CNB, CN 用户当前 profile 为 Release-CN 时会走 CNB
          $srcRoot = $env:GITHUB_WORKSPACE
          Get-Content (Join-Path $srcRoot "deploy.txt") |
            Where-Object { $_.Trim() -and -not $_.Trim().StartsWith('#') } |
            ForEach-Object {
              $entry = $_.Trim().Trim('/')
              $src = Join-Path $srcRoot $entry
              if (Test-Path $src) {
                Copy-Item $src $work -Recurse -Force
              }
            }

          # 清掉内联包里的缓存目录
          Get-ChildItem $work -Recurse -Directory -Filter "__pycache__" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to sync to CNB mirror."
          } else {
            git commit -m "release $tag"
          }
          git tag -f "$tag"
          git push origin HEAD
          git push origin "$tag" -f

      - name: Build launcher with PyAppify Action
        id: build-app
        if: ${{ env.USE_RELEASE == '' }}
        uses: ok-oldking/pyappify-action@master #只编译启动器exe, 不再走NSIS安装器
        with:
          build_exe_only: true

      - name: Reuse launcher from previous release
        id: reuse-app
        if: ${{ env.USE_RELEASE != '' }}
        shell: pwsh
        run: |
          # pyappify-action 的 use_release 与 build_exe_only 互斥且会连带打 NSIS 安装器,
          # 这里做等效事: 从指定 Release 下载 ok-nikke-win32.zip, 取出 exe 直接使用
          $url = "${{ env.USE_RELEASE }}"
          $release = Invoke-RestMethod -Uri $url -Headers @{ "User-Agent" = "ok-nikke-build" }
          $asset = $release.assets | Where-Object { $_.name -eq "ok-nikke-win32.zip" } | Select-Object -First 1
          if (-not $asset) { throw "未在 $url 找到 ok-nikke-win32.zip 资产(该版本发布时工作流尚不上传启动器 zip)" }
          $zip = Join-Path $env:RUNNER_TEMP "ok-nikke-win32.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          $extract = Join-Path $env:RUNNER_TEMP "ok-nikke-launcher"
          Expand-Archive $zip $extract -Force
          $exe = Join-Path $extract "ok-nikke" "ok-nikke.exe"
          if (-not (Test-Path $exe)) { throw "启动器 zip 中未找到 ok-nikke/ok-nikke.exe" }
          echo "exe-path=$exe" >> $env:GITHUB_OUTPUT

      - name: Package portable zips
        shell: pwsh
        run: |
          # 运行启动器 setup 命令, 在 exe 同目录生成 data(内嵌Python/venv/按 profile 的 git_url 克隆的代码);
          # -p 的 profile 名与 pyappify.yml 里的 profiles 对应(Release=GitHub, Release-CN=CNB)
          # build-app / reuse-app 两个分支必有其一, 被跳过步骤的 output 为空字符串
          $exeSrc = "${{ steps.build-app.outputs.exe-path }}${{ steps.reuse-app.outputs.exe-path }}"
          if (-not (Test-Path $exeSrc)) { throw "launcher exe not found: '$exeSrc'" }
          $dist = "pyappify_dist"
          # 顺便产出 ok-nikke-win32.zip 启动器包(顶层目录 ok-nikke/, 与 pyappify 基础包格式一致),
          # 随 Release 发布, 供后续版本通过 USE_RELEASE 复用以跳过 Tauri 编译
          $stage = Join-Path $dist "launcher-stage"
          New-Item -ItemType Directory -Path (Join-Path $stage "ok-nikke") -Force | Out-Null
          Copy-Item $exeSrc (Join-Path $stage "ok-nikke" "ok-nikke.exe")
          Compress-Archive -Path (Join-Path $stage "ok-nikke") -DestinationPath (Join-Path $dist "ok-nikke-win32.zip") -Force
          Remove-Item $stage -Recurse -Force
          $tag = "${{ github.ref_name }}"
          $githubUrl = "https://github.com/c6n1aa/ok-nikke.git"
          $cnbUrl = "https://cnb.cool/c6n1aa/ok-nikke"

          function Invoke-PortableSetup($appDir, $profile, $gitUrl) {
            New-Item -ItemType Directory -Path $appDir -Force | Out-Null
            $exe = Join-Path $appDir "ok-nikke.exe"
            Copy-Item $exeSrc $exe
            # launcher 是 windows_subsystem="windows" 的 GUI 程序, `&` 不会等待也拿不到退出码;
            # 必须用 Start-Process -Wait -PassThru 阻塞到 setup 完成并读取 ExitCode
            $leaf = Split-Path $appDir -Leaf
            $setupOut = Join-Path $dist "setup-$leaf.stdout.log"
            $setupErr = Join-Path $dist "setup-$leaf.stderr.log"
            $setup = Start-Process -FilePath $exe -ArgumentList "-c","setup","-p",$profile -Wait -PassThru -RedirectStandardOutput $setupOut -RedirectStandardError $setupErr
            Get-Content $setupOut -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
            Get-Content $setupErr -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
            if ($setup.ExitCode -ne 0) { throw "pyappify setup failed with exit code $($setup.ExitCode)" }
            if (-not (Test-Path (Join-Path $appDir "data"))) { throw "pyappify setup did not generate the data folder" }
            # setup 不会把 git 元数据(.git)留进 repo/, 便携包因此不被识别为已安装;
            # 这里重新克隆对应源仓库并 checkout 当前 tag, 让包自带可更新的 git 仓库
            $repoDir = Join-Path $appDir "data/apps/ok-nikke/repo"
            Remove-Item $repoDir -Recurse -Force -ErrorAction SilentlyContinue
            git clone "$gitUrl" $repoDir
            if ($LASTEXITCODE -ne 0) { throw "git clone failed for $gitUrl" }
            git -C "$repoDir" checkout -q "$tag"
            if ($LASTEXITCODE -ne 0) { throw "git checkout failed for tag $tag" }
            # 清掉打包过程中产生的缓存/日志, 不进便携包
            Remove-Item (Join-Path $appDir "cache") -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item (Join-Path $appDir "logs") -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item (Join-Path $appDir "EBWebView") -Recurse -Force -ErrorAction SilentlyContinue
          }

          # Global 便携包: Release profile → GitHub
          $globalDir = Join-Path $dist "ok-nikke"
          Invoke-PortableSetup $globalDir "Release" $githubUrl
          Compress-Archive -Path $globalDir -DestinationPath "$dist\ok-nikke-win32-portable.zip" -Force

          # CN 便携包: Release-CN profile → CNB 镜像
          $cnDir = Join-Path $dist "ok-nikke-cn"
          Invoke-PortableSetup $cnDir "Release-CN" $cnbUrl
          Compress-Archive -Path $cnDir -DestinationPath "$dist\ok-nikke-win32-portable-cn.zip" -Force

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ###  更新日志
              请查看提交记录。
            ### 下载说明
              * [ok-nikke-win32-portable.zip](https://github.com/c6n1aa/ok-nikke/releases/download/${{ github.ref_name }}/ok-nikke-win32-portable.zip) 全球版完整便携包: 从 GitHub 更新, 解压到任意目录运行 ok-nikke.exe (需管理员权限)。
              * [ok-nikke-win32-portable-cn.zip](https://github.com/c6n1aa/ok-nikke/releases/download/${{ github.ref_name }}/ok-nikke-win32-portable-cn.zip) 国内版完整便携包: 从 CNB 镜像更新, 解压到任意目录运行 ok-nikke.exe (需管理员权限)。
              * ok-nikke-win32.zip 仅含启动器, 供 CI 复用加速构建, 普通用户无需下载。
              * 无需下载 Source code, 仅供存档用。
          files: |
            pyappify_dist/ok-nikke-win32-portable.zip
            pyappify_dist/ok-nikke-win32-portable-cn.zip
            pyappify_dist/ok-nikke-win32.zip
