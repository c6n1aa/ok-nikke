site_name: ok-nikke
site_description: NIKKE Windows 原生游戏自动化应用，基于 ok-script。
repo_name: c6n1aa/ok-nikke
repo_url: https://github.com/c6n1aa/ok-nikke
edit_uri: edit/master/docs/

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: readthedocs
  locale: zh_CN

plugins:
  - search
exclude_docs: |
  framework-upgrade-plan.md
  framework-upgrade-impact-and-risks.md
  after_quick_start/
  api_doc/

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - 中文:
      - 首页: index.md
      - 快速开始: getting-started.md
      - 应用配置: configuration.md
      - 任务开发: tasks.md
      - 任务简报模板: task_brief_template.md
      - 界面识别与失败恢复: screen-and-recovery.md
      - 打包与发布: release.md
      - 文档网站: documentation.md
  - English:
      - Home: en/index.md
      - Quick Start: en/getting-started.md
      - App Configuration: en/configuration.md
      - Task Development: en/tasks.md
      - Task Brief Template: en/task_brief_template.md
      - Screen Recognition & Failure Recovery: en/screen-and-recovery.md
      - Packaging and Release: en/release.md
      - Documentation Site: en/documentation.md
