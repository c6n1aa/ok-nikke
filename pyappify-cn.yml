# 国内网络用户：首次运行前，把本文件重命名为 pyappify.yml（与 ok-nikke.exe 放同一目录）。
name: "ok-nikke"
uac: true
icon: "icons/icon.png"
profiles:
  # profile 名改动时需同步 .github/workflows/build.yml 中 setup 步骤的 -p 参数
  - name: "Release"
    # TODO(国内镜像): 镜像仓库建好后，把下面 git_url 改成镜像地址即可（镜像仓库内也要放一份指向镜像自身的 pyappify.yml）
    git_url: "https://github.com/c6n1aa/ok-nikke.git"
    admin: true
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    pip_args: "--no-deps"
    use_pythonw: true
    show_add_defender: true