# 国内网络用户：首次运行前，把本文件重命名为 pyappify.yml（与 ok-nikke.exe 放同一目录）。
name: "ok-nikke"
uac: true
icon: "icons/icon.png"
profiles:
  # profile 名改动时需同步 .github/workflows/build.yml 中 setup 步骤的 -p 参数
  - name: "Release"
    git_url: "https://cnb.cool/c6n1aa/ok-nikke"
    admin: true
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    pip_args: "--no-deps"
    use_pythonw: true
    show_add_defender: true